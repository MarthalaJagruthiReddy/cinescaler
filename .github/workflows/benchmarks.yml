name: cinescaler-benchmarks

on:
  push:
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cinescaler
          POSTGRES_PASSWORD: cinescaler
          POSTGRES_DB: cinescaler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinescaler -d cinescaler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://cinescaler:cinescaler@localhost:5432/cinescaler
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Start API
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/cinescaler.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          cat /tmp/cinescaler.log
          exit 1
      - name: Run load test
        run: python benchmarks/load_test.py | tee cinescaler-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: cinescaler-load-results
          path: cinescaler-benchmark.json
